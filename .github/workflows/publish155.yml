name: Publish verified gTouchPal155 files
on:
  workflow_dispatch:
    inputs:
      files:
        description: Temporary download references for the three verified155 artifacts
        required: true
        type: string
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify the exact prepared files
        env:
          FILES_JSON: ${{ inputs.files }}
        run: |
          python - <<'PYCODE'
          import os,json,urllib.request,hashlib
          from pathlib import Path
          expected={'155-gTouchPal-6.2.7.1.apk': '1eeb58b276fc02541491edf65ec01f50bbd68faacb2a465149308cddea6fafb5', '155-gTouchPal-SOURCE-6.2.7.1.zip': 'cc3ce8070f80733ec92a7f93bab737cd59df136f269eab397636924e0081d27d', '155-gTouchPal-Passport-6.2.7.1.txt': '11b1c79f47973ac740faf801e087d95d8edb2fc0f137961a4da07a2fa1a6a824'}
          files=json.loads(os.environ['FILES_JSON'])
          assert set(files)==set(expected)
          for name,item in files.items():
              url=item['url']
              print('::add-mask::'+url)
              assert url.startswith('https://')
              target=Path(name)
              with urllib.request.urlopen(url,timeout=120) as response,target.open('wb') as out:
                  while True:
                      chunk=response.read(1048576)
                      if not chunk:break
                      out.write(chunk)
              assert hashlib.sha256(target.read_bytes()).hexdigest()==expected[name],name
              print('Verified '+name)
          PYCODE
      - name: Attach files to the155 draft without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v155 155-gTouchPal-6.2.7.1.apk 155-gTouchPal-SOURCE-6.2.7.1.zip 155-gTouchPal-Passport-6.2.7.1.txt --repo "$GITHUB_REPOSITORY"
