name: Publish verified gTouchPal160 files
on:
  workflow_dispatch:
    inputs:
      files:
        description: Temporary download references for the three verified160 artifacts
        required: true
        type: string
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify the exact prepared files
        env:
          FILES_JSON: ${{ inputs.files }}
        run: |
          python - <<'PYCODE'
          import os,json,urllib.request,hashlib
          from pathlib import Path
          expected={'160-gTouchPal-6.2.7.1.apk': '8e4f1442ca3a817b70fe00fada759933e8cc8db02660dd29c8a111d1990b20fd', '160-gTouchPal-SOURCE-6.2.7.1.zip': '391fa74a91f64a75cb446f6e60a27f620c4c18c5b22dc75e22eab3a233fdd732', '160-gTouchPal-Passport-6.2.7.1.txt': 'cd7cc4a69c049dde683502920aab34be312cfe39c41e14fe1eb926a5b6cd7be6'}
          files=json.loads(os.environ['FILES_JSON'])
          assert set(files)==set(expected)
          for name,item in files.items():
              url=item['url']
              print('::add-mask::'+url)
              assert url.startswith('https://')
              target=Path(name)
              with urllib.request.urlopen(url,timeout=120) as response,target.open('wb') as out:
                  while True:
                      chunk=response.read(1048576)
                      if not chunk:break
                      out.write(chunk)
              assert hashlib.sha256(target.read_bytes()).hexdigest()==expected[name],name
              print('Verified '+name)
          PYCODE
      - name: Attach files to the160 draft without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v160 160-gTouchPal-6.2.7.1.apk 160-gTouchPal-SOURCE-6.2.7.1.zip 160-gTouchPal-Passport-6.2.7.1.txt --repo "$GITHUB_REPOSITORY"
