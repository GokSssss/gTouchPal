name: Publish verified gTouchPal153 files
on:
  workflow_dispatch:
    inputs:
      files:
        description: Temporary download references for the three verified153 artifacts
        required: true
        type: string
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify the exact prepared files
        env:
          FILES_JSON: ${{ inputs.files }}
        run: |
          python - <<'PYCODE'
          import os,json,urllib.request,hashlib
          from pathlib import Path
          expected={'153-gTouchPal-6.2.7.1.apk': 'eb4b42cc019f72545e2141249a0bc536ad9b4cf9b28ae537cdc68096d0adcf5b', '153-gTouchPal-SOURCE-6.2.7.1.zip': '2914ef44a198e92cd5aaecc78deb45115fb884d67ac68453a7d1410d8db2641d', '153-gTouchPal-Passport-6.2.7.1.txt': '67a57eb6412495d5e76009d410ad262248de41572ba554a41b3d78d84ba4937c'}
          files=json.loads(os.environ['FILES_JSON'])
          assert set(files)==set(expected)
          for name,item in files.items():
              url=item['url']
              print('::add-mask::'+url)
              assert url.startswith('https://')
              target=Path(name)
              with urllib.request.urlopen(url,timeout=120) as response,target.open('wb') as out:
                  while True:
                      chunk=response.read(1048576)
                      if not chunk:break
                      out.write(chunk)
              assert hashlib.sha256(target.read_bytes()).hexdigest()==expected[name],name
              print('Verified '+name)
          PYCODE
      - name: Attach files to the153 draft without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v153 153-gTouchPal-6.2.7.1.apk 153-gTouchPal-SOURCE-6.2.7.1.zip 153-gTouchPal-Passport-6.2.7.1.txt --repo "$GITHUB_REPOSITORY"
