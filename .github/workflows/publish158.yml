name: Publish verified gTouchPal158 files
on:
  workflow_dispatch:
    inputs:
      files:
        description: Temporary download references for the three verified158 artifacts
        required: true
        type: string
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify the exact prepared files
        env:
          FILES_JSON: ${{ inputs.files }}
        run: |
          python - <<'PYCODE'
          import os,json,urllib.request,hashlib
          from pathlib import Path
          expected={'158-gTouchPal-6.2.7.1.apk': 'b08fbc1070de01a2d60d288a0f3f7bc4d3adebf9fde4881aebdc7d33f83b16d8', '158-gTouchPal-SOURCE-6.2.7.1.zip': 'b413a69a28293eeacafb9034faad0b7584eca765879f19f8e49b8e96e683d489', '158-gTouchPal-Passport-6.2.7.1.txt': 'bb0157f2f3f5d56afd7a93ebc6d2024047b0155d28cd1d3905340e2d90af5d88'}
          files=json.loads(os.environ['FILES_JSON'])
          assert set(files)==set(expected)
          for name,item in files.items():
              url=item['url']
              print('::add-mask::'+url)
              assert url.startswith('https://')
              target=Path(name)
              with urllib.request.urlopen(url,timeout=120) as response,target.open('wb') as out:
                  while True:
                      chunk=response.read(1048576)
                      if not chunk:break
                      out.write(chunk)
              assert hashlib.sha256(target.read_bytes()).hexdigest()==expected[name],name
              print('Verified '+name)
          PYCODE
      - name: Attach files to the158 draft without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v158 158-gTouchPal-6.2.7.1.apk 158-gTouchPal-SOURCE-6.2.7.1.zip 158-gTouchPal-Passport-6.2.7.1.txt --repo "$GITHUB_REPOSITORY"
